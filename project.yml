name: Flowmap

options:
  bundleIdPrefix: com.flowmap
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Flowmap:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Flowmap
        excludes:
          - "**/.DS_Store"
    info:
      path: Flowmap/Resources/Info.plist
      properties:
        CFBundleDisplayName: Flowmap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Flowmap shows your existing calendar events as fixed blocks so your plan never double-books you.
        NSRemindersFullAccessUsageDescription: Flowmap can read reminders you choose to import as tasks.
        NSSpeechRecognitionUsageDescription: Flowmap turns your spoken quick captures into tasks.
        NSMicrophoneUsageDescription: Flowmap uses the microphone for voice capture of tasks and assistant messages.
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        # The iA Writer font option (Settings → General). XcodeGen copies the
        # Fonts/ files flat into the bundle's resource root, hence the bare
        # filenames here and "." for the macOS font-scan path.
        UIAppFonts:
          - iAWriterQuattroS-Regular.ttf
          - iAWriterQuattroS-Bold.ttf
        ATSApplicationFontsPath: "."
        CFBundleURLTypes:
          - CFBundleURLName: com.flowmap.app.deeplink
            CFBundleURLSchemes: [flowmap]
        # Drag and drop on the Today timeline exports this type. Declaring it
        # here is required: `UTType(exportedAs:)` without a matching Info.plist
        # entry logs a type-declaration error on every drag session.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.flowmap.timelineitem
            UTTypeDescription: Flowmap timeline item
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Flowmap/Resources/Flowmap.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.flowmap.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.device.audio-input: true
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowmap.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES

  FlowmapTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Flowmap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flowmap.app.tests
        # The host binary sits at a different path on each platform, so the
        # multiplatform target needs both spelled out.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Flowmap.app/Contents/MacOS/Flowmap"
        TEST_HOST[sdk=iphoneos*]: "$(BUILT_PRODUCTS_DIR)/Flowmap.app/Flowmap"
        TEST_HOST[sdk=iphonesimulator*]: "$(BUILT_PRODUCTS_DIR)/Flowmap.app/Flowmap"
        BUNDLE_LOADER: "$(TEST_HOST)"

  FlowmapUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: Flowmap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flowmap.app.uitests
        TEST_TARGET_NAME: Flowmap

  # The watch edition is a separate target rather than a shared destination:
  # the phone owns FocusEngine and SchedulingService, and the watch only ever
  # renders a snapshot and sends commands back, so it needs none of that code.
  FlowmapWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: FlowmapWatch
        excludes:
          - "**/.DS_Store"
      # Shared with the phone, file by file. Anything not listed here is
      # deliberately absent from the watch build.
      - path: Flowmap/Services/WatchSyncPayloads.swift
      - path: Flowmap/Services/WatchSyncService.swift
      - path: Flowmap/DesignSystem/FlowTheme.swift
      - path: Flowmap/DesignSystem/Typography.swift
      - path: Flowmap/DesignSystem/Spacing.swift
      - path: Flowmap/Models/DurationFormatter.swift
    info:
      path: FlowmapWatch/Info.plist
      properties:
        CFBundleDisplayName: Flowmap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        # Not watch-only: the phone owns the data, so watchOS wants the companion
        # named here. Without it the app will not even install.
        WKCompanionAppBundleIdentifier: com.flowmap.app
        NSSpeechRecognitionUsageDescription: Flowmap turns what you dictate into a task on your phone.
        NSMicrophoneUsageDescription: Flowmap records your dictated captures.
    entitlements:
      path: FlowmapWatch/FlowmapWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flowmap.app
    dependencies:
      - target: FlowmapWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowmap.app.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # The complication. Reads the same snapshot the watch app last received, from
  # the shared app group, so a glance is never a different truth to the app.
  FlowmapWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: FlowmapWatchWidget
        excludes:
          - "**/.DS_Store"
      - path: Flowmap/Services/WatchSyncPayloads.swift
      - path: Flowmap/DesignSystem/FlowTheme.swift
      - path: Flowmap/DesignSystem/Typography.swift
      - path: Flowmap/DesignSystem/Spacing.swift
      - path: Flowmap/Models/DurationFormatter.swift
    info:
      path: FlowmapWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Flowmap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: FlowmapWatchWidget/FlowmapWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flowmap.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowmap.app.watchkitapp.complication
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  FlowmapWatch:
    build:
      targets:
        FlowmapWatch: all
    run:
      config: Debug

  Flowmap:
    build:
      targets:
        Flowmap: all
        FlowmapTests: [test]
        FlowmapUITests: [test]
    test:
      targets:
        - FlowmapTests
        - FlowmapUITests
      gatherCoverageData: true
    run:
      config: Debug
