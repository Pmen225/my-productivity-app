name: Flowmap

options:
  bundleIdPrefix: com.flowmap
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Flowmap:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Flowmap
        excludes:
          - "**/.DS_Store"
    info:
      path: Flowmap/Resources/Info.plist
      properties:
        CFBundleDisplayName: Flowmap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Flowmap shows your existing calendar events as fixed blocks so your plan never double-books you.
        NSRemindersFullAccessUsageDescription: Flowmap can read reminders you choose to import as tasks.
        NSSpeechRecognitionUsageDescription: Flowmap turns your spoken quick captures into tasks.
        NSMicrophoneUsageDescription: Flowmap uses the microphone for voice capture of tasks and assistant messages.
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Flowmap/Resources/Flowmap.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.flowmap.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.device.audio-input: true
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowmap.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES

  FlowmapTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Flowmap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flowmap.app.tests

  FlowmapUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: Flowmap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flowmap.app.uitests
        TEST_TARGET_NAME: Flowmap

schemes:
  Flowmap:
    build:
      targets:
        Flowmap: all
        FlowmapTests: [test]
        FlowmapUITests: [test]
    test:
      targets:
        - FlowmapTests
        - FlowmapUITests
      gatherCoverageData: true
    run:
      config: Debug
