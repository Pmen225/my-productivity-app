name: Flowmap verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: policy-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/check-public-policy.sh

  iphone-tests:
    name: iphone-unit-tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Flowmap.xcodeproj -scheme Flowmap -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -only-testing:FlowmapTests CODE_SIGNING_ALLOWED=NO test

  mac-tests:
    name: mac-build-tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: ./scripts/build.sh mac test

  watch-build:
    name: watch-type-check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: ./scripts/build.sh watch build

  assistant-evaluations:
    name: assistant-evaluations
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Flowmap.xcodeproj -scheme Flowmap -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -only-testing:FlowmapTests/AssistantConversationRunnerTests CODE_SIGNING_ALLOWED=NO test

  ui-evidence:
    name: affected-scope-ui-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-ui-evidence.sh
      - run: ./scripts/generate-compliance-report.sh build/compliance-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: flowmap-compliance-report
          path: build/compliance-report.json
